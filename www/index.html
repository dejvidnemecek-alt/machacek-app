<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Macháček</title>
<style>
  :root{
    --felt-dark:#0c2a1c;
    --felt:#123a26;
    --felt-light:#1c5138;
    --wood:#7a4a26;
    --wood-dark:#5c3618;
    --parchment:#f3ead2;
    --parchment-dark:#e6d9b8;
    --ink:#2b2118;
    --gold:#cc9f2c;
    --gold-dark:#a17f1f;
    --danger:#a83e35;
    --danger-dark:#832e27;
    --truth:#3d7350;
    --truth-dark:#2c5a3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    color:var(--parchment);
    min-height:100%;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:18px 16px 40px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  h1,h2,h3{
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    margin:0;
  }
  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand h1{
    font-size:2.4em;
    letter-spacing:1px;
    color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .brand p{
    margin:4px 0 0;
    font-size:.85em;
    color:var(--parchment-dark);
    opacity:.75;
  }
  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:14px;
    padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    border:1px solid var(--wood-dark);
    margin-bottom:14px;
  }
  .card h2{
    font-size:1.15em;
    margin-bottom:10px;
    color:var(--wood-dark);
  }
  label{
    display:block;
    font-size:.8em;
    font-weight:600;
    margin-bottom:6px;
    color:var(--wood-dark);
  }
  input[type=text]{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid #c9b98c;
    background:#fffdf7;
    font-size:1em;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--gold);}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn{
    padding:12px 16px;
    border-radius:10px;
    font-size:1em;
    font-weight:700;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-gold{background:var(--gold);color:#2b2118;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-truth{background:var(--truth);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--wood-dark);color:var(--wood-dark);}
  .btn-add{background:var(--wood);color:var(--parchment);padding:10px 14px;border-radius:8px;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-block{width:100%;padding:14px;font-size:1.05em;}

  .player-list{list-style:none;margin:10px 0 0;padding:0;}
  .player-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px;
    background:#fffdf7;
    border:1px solid #ddd0aa;
    border-radius:8px;
    margin-bottom:6px;
    font-weight:600;
  }
  .player-list li button{
    background:none;color:var(--danger);font-size:1.1em;font-weight:900;padding:0 6px;
  }
  .segmented{
    display:flex;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--wood-dark);
  }
  .segmented button{
    flex:1;
    padding:10px;
    background:#fffdf7;
    color:var(--ink);
    font-weight:700;
    font-size:.9em;
  }
  .segmented button.active{
    background:var(--wood);
    color:var(--parchment);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:center;
    margin-top:10px;
  }
  .stepper button{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--wood);
    color:var(--parchment);
    font-size:1.2em;
    font-weight:900;
  }
  .stepper .val{font-size:1.4em;font-weight:800;min-width:34px;text-align:center;}

  details{margin-top:6px;}
  summary{cursor:pointer;font-weight:700;color:var(--wood-dark);font-size:.85em;}
  .rules-text{font-size:.85em;line-height:1.5;margin-top:8px;color:#4a3c26;}
  .rules-text b{color:var(--wood-dark);}

  /* game screen */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:.8em;
    color:var(--parchment-dark);
  }
  .topbar button{
    background:none;
    color:var(--parchment-dark);
    text-decoration:underline;
    font-size:.95em;
    padding:4px;
  }
  .scoreboard{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
  }
  .chip{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:5px 10px;
    font-size:.75em;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .chip.current{
    background:var(--gold);
    color:#2b2118;
    font-weight:800;
    border-color:var(--gold-dark);
  }
  .chip.out{opacity:.4;text-decoration:line-through;}
  .lives-dots{display:flex;gap:2px;}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .turn-card{
    text-align:center;
    padding:26px 18px;
  }
  .turn-card .who{
    font-size:1.5em;
    color:var(--wood-dark);
    margin-bottom:4px;
  }
  .turn-card .hint{
    font-size:.85em;
    color:#6b5a3c;
    margin-bottom:18px;
  }
  .dice-stage{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:10px 0 6px;
    perspective:600px;
  }
  .die{
    width:78px;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.6em;
    line-height:1;
    color:var(--ink);
    background:#fffdf7;
    border:2px solid #cbb989;
    border-radius:16px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .die.spinning{
    animation:tumble .5s linear infinite;
  }
  .die.settled{
    animation:settle .3s ease;
  }
  @keyframes tumble{
    0%{transform:rotate(0deg) scale(1);}
    50%{transform:rotate(180deg) scale(.85);}
    100%{transform:rotate(360deg) scale(1);}
  }
  @keyframes settle{
    0%{transform:scale(1.3) rotate(-10deg);}
    60%{transform:scale(.92) rotate(4deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .dice-sub{font-size:.8em;color:#6b5a3c;margin:8px 0 16px;}

  .prev-declared{
    background:rgba(0,0,0,.25);
    border-radius:10px;
    padding:14px;
    text-align:center;
    margin-bottom:14px;
    font-size:.9em;
    color:var(--parchment-dark);
  }

  .reveal-box{
    background:rgba(0,0,0,.25);
    border-radius:10px;
    padding:16px;
    text-align:center;
    margin-bottom:16px;
  }
  .reveal-box .lbl{font-size:.8em;color:var(--parchment-dark);margin-bottom:6px;}

  .outcome-banner{
    text-align:center;
    padding:14px;
    border-radius:10px;
    font-weight:800;
    font-size:1.1em;
    margin-bottom:14px;
  }
  .outcome-banner.lie{background:var(--danger);color:#fff;}
  .outcome-banner.truth{background:var(--truth);color:#fff;}

  .footer-note{
    text-align:center;
    font-size:.7em;
    color:var(--parchment-dark);
    opacity:.55;
    margin-top:auto;
    padding-top:20px;
  }

  .winner-card{
    text-align:center;
    padding:32px 18px;
  }
  .winner-card .trophy{font-size:3em;margin-bottom:6px;}
  .standings{list-style:none;padding:0;margin:14px 0 0;text-align:left;}
  .standings li{
    display:flex;
    justify-content:space-between;
    padding:8px 10px;
    border-bottom:1px solid #e6d9b8;
    font-weight:600;
  }

  .lang{display:flex;gap:4px;}
  .lang button{
    background:rgba(255,255,255,.1);
    color:var(--parchment-dark);
    border:1px solid rgba(255,255,255,.2);
    border-radius:6px;
    padding:3px 8px;
    font-size:.8em;
    font-weight:700;
  }
  .lang button.active{background:var(--gold);color:#2b2118;border-color:var(--gold-dark);}
  .setup-top{display:flex;justify-content:flex-end;margin-bottom:8px;}
  .topbar-right{display:flex;gap:8px;}
  .rules-body{font-size:.88em;line-height:1.5;color:#4a3c26;}
  .rules-body h3{font-size:1em;margin:14px 0 4px;color:var(--wood-dark);}
  .rules-body h3:first-child{margin-top:8px;}
  .rules-body p{margin:4px 0;}
  .rules-body ol{margin:4px 0;padding-left:20px;}
  .rules-body li{margin-bottom:4px;}
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    z-index:50;
  }
  .overlay-box{
    background:var(--parchment);
    color:var(--ink);
    border-radius:14px;
    padding:18px;
    width:100%;
    max-width:440px;
    max-height:85vh;
    overflow-y:auto;
    border:1px solid var(--wood-dark);
  }
</style>
</head>

      bannerLie:"{name} hat gelogen!", bannerTruth:"{name} hat die Wahrheit gesagt!",
      lostRound:"{name} verliert diese Runde",
      lostLife:" und verliert ein Leben (noch {n}).", eliminated:" und scheidet aus!",
      lossesTotal:" (Niederlagen insgesamt: {n}).",
      showResult:"Ergebnis anzeigen", nextRound:"Nächste Runde",
      wins:"{name} gewinnt!", gameOver:"Spielende", standings:"Endstand",
      outTxt:"ausgeschieden", lossesLbl:"{n} Niederlagen",
      playAgain:"Nochmal spielen (gleiche Spieler)", newSetup:"Neue Spielerrunde",
      rules:
        "<h3>Ziel des Spiels</h3>" +
        "<p>Nicht alle Leben verlieren (im freien Modus: möglichst wenige Runden verlieren). Im Modus Leben gewinnt, wer als Letzter im Spiel bleibt.</p>" +
        "<h3>Würfe und ihre Rangfolge</h3>" +
        "<p>Gespielt wird mit zwei Würfeln. Der Wurf wird als zweistellige Zahl gelesen, der höhere Würfel zuerst: bei 5 und 3 ist es &bdquo;53&ldquo;. Zwei gleiche Würfel bilden einen Pasch (z. B. &bdquo;44&ldquo;). Der beste Wurf ist die <b>21</b> (Würfel 2 und 1), der Macháček.</p>" +
        "<p><b>Vom besten zum schlechtesten:</b> 21 &gt; 11 &gt; 66 &gt; 55 &gt; 44 &gt; 33 &gt; 22 &gt; 65 &gt; 64 &gt; 63 &gt; 62 &gt; 61 &gt; 54 &gt; 53 &gt; 52 &gt; 51 &gt; 43 &gt; 42 &gt; 41 &gt; 32 &gt; 31.</p>" +
        "<h3>Ablauf eines Zuges</h3>" +
        "<ol><li>Wer dran ist, nimmt das Handy und tippt auf <b>Würfeln</b>. Nur er sieht die Würfel, alle anderen schauen weg.</li>" +
        "<li>Er sagt den anderen laut eine Zahl an. Er darf die Wahrheit sagen oder bluffen und einen besseren Wurf ansagen, als er hat. Die App prüft die Ansage nicht, das überwacht ihr selbst.</li>" +
        "<li>Hat schon jemand vor ihm eine Zahl angesagt, muss er dieselbe oder eine bessere ansagen.</li>" +
        "<li>Er gibt das Handy an den nächsten Spieler weiter.</li></ol>" +
        "<h3>Glauben oder nicht glauben</h3>" +
        "<p>Der nächste Spieler entscheidet. <b>Ich glaube es</b> &ndash; er nimmt das Handy, würfelt selbst und sagt seine Zahl an (gleich oder besser als die vorherige). <b>Ich glaube es nicht</b> &ndash; die App deckt auf, was der vorherige Spieler wirklich gewürfelt hat.</p>" +
        "<h3>Wer verliert</h3>" +
        "<p>Vergleicht nach dem Aufdecken den echten Wurf mit der Ansage. Wurde ein besserer Wurf angesagt als gewürfelt, hat der Spieler gelogen und verliert. Hat er die Wahrheit gesagt, verliert der, der ihm nicht geglaubt hat. Die App weiß nicht, was laut gesagt wurde, deshalb wählt ihr den Verlierer selbst mit einem Tipp.</p>" +
        "<h3>Nach einer Niederlage</h3>" +
        "<p>Im Modus Leben verliert der Verlierer ein Leben und scheidet bei null aus. Im freien Modus wird ihm einfach eine Niederlage gutgeschrieben. Die nächste Runde beginnt der Verlierer.</p>" +
        "<h3>Tipp</h3>" +
        "<p>Nach einer angesagten 21 kann niemand mehr höher gehen, der nächste Spieler kann also nur wieder 21 ansagen oder nicht glauben.</p>"
    }
  };

  function detectLang(){
    var nav = ((navigator.language || "en") + "").slice(0,2).toLowerCase();
    return I18N[nav] ? nav : "en";
  }

  // ---------- state ----------
  var state = {
    lang: detectLang(),
    phase:"setup", // setup | rolling | spinning | revealed | pass | doubt | resolved | gameover
    players:[],
    mode:"lives",
    startingLives:3,
    currentIndex:0,
    previousActual:null,
    liveDice:[1,1],
    round:1,
    outcome:null,
    newPlayerName:"",
    showRules:false,
    spinTimer:null
  };

  function t(key, vars){
    var s = I18N[state.lang][key];
    if(s === undefined) s = I18N.en[key] || key;
    if(vars){
      Object.keys(vars).forEach(function(k){
        var v = typeof vars[k] === "number" ? vars[k] : esc(vars[k]);
        s = s.split("{"+k+"}").join(v);
      });
    }
    return s;
  }

  function activePlayers(){ return state.players.filter(function(p){return p.active;}); }

  function nextActiveIndex(from){
    var n = state.players.length;
    var i = from;
    for(var k=0;k<n;k++){
      i = (i+1) % n;
      if(state.players[i].active) return i;
    }
    return from;
  }

  var root = document.getElementById("app");

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html!==undefined) e.innerHTML = html;
    return e;
  }

  function langSwitch(){
    var d = el("div","lang");
    ["cs","en","de"].forEach(function(l){
      var b = el("button", l===state.lang ? "active" : "", l.toUpperCase());
      b.addEventListener("click", function(){
        if(state.phase==="spinning") return;
        state.lang = l;
        render();
      });
      d.appendChild(b);
    });
    return d;
  }

  function rulesOverlay(){
    var ov = el("div","overlay");
    var box = el("div","overlay-box");
    box.appendChild(el("div","rules-body", t("rules")));
    var closeBtn = el("button","btn btn-gold btn-block", t("close"));
    closeBtn.style.marginTop = "12px";
    closeBtn.addEventListener("click", function(){ state.showRules = false; render(); });
    box.appendChild(closeBtn);
    ov.appendChild(box);
    ov.addEventListener("click", function(e){
      if(e.target === ov){ state.showRules = false; render(); }
    });
    return ov;
  }

  // ---------- render root ----------
  function render(){
    document.documentElement.lang = state.lang;
    document.title = "Macháček";
    if(state.phase==="setup") renderSetup();
    else if(state.phase==="gameover") renderGameOver();
    else renderGame();
    if(state.showRules) root.appendChild(rulesOverlay());
  }

  // ---------- SETUP ----------
  function renderSetup(){
    root.innerHTML = "";

    var top = el("div","setup-top");
    top.appendChild(langSwitch());
    root.appendChild(top);

    root.appendChild(el("div","brand","<h1>Macháček</h1><p>" + t("subtitle") + "</p>"));

    var card = el("div","card");
    card.appendChild(el("h2",null,t("players")));

    var row = el("div","row");
    var input = document.createElement("input");
    input.type="text";
    input.placeholder = I18N[state.lang].playerPlaceholder;
    input.value = state.newPlayerName;
    input.addEventListener("input", function(e){ state.newPlayerName = e.target.value; });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ addPlayer(); } });
    row.appendChild(input);
    var addBtn = el("button","btn-add",t("add"));
    addBtn.addEventListener("click", addPlayer);
    row.appendChild(addBtn);
    card.appendChild(row);

    var list = el("ul","player-list");
    state.players.forEach(function(p, idx){
      var li = document.createElement("li");
      li.appendChild(el("span",null,esc(p.name)));
      var rm = el("button",null,"&times;");
      rm.addEventListener("click", function(){ state.players.splice(idx,1); render(); });
      li.appendChild(rm);
      list.appendChild(li);
    });
    card.appendChild(list);
    root.appendChild(card);

    var modeCard = el("div","card");
    modeCard.appendChild(el("h2",null,t("penaltyTitle")));
    var seg = el("div","segmented");
    var b1 = el("button", state.mode==="lives"?"active":"", t("modeLives"));
    var b2 = el("button", state.mode==="free"?"active":"", t("modeFree"));
    b1.addEventListener("click", function(){ state.mode="lives"; render(); });
    b2.addEventListener("click", function(){ state.mode="free"; render(); });
    seg.appendChild(b1); seg.appendChild(b2);
    modeCard.appendChild(seg);

    if(state.mode==="lives"){
      var stepper = el("div","stepper");
      var minus = el("button",null,"−");
      var val = el("div","val", state.startingLives);
      var plus = el("button",null,"+");
      minus.addEventListener("click", function(){ if(state.startingLives>1) state.startingLives--; render(); });
      plus.addEventListener("click", function(){ if(state.startingLives<9) state.startingLives++; render(); });
      stepper.appendChild(minus); stepper.appendChild(val); stepper.appendChild(plus);
      modeCard.appendChild(el("p","rules-text",t("livesInfo")));
      modeCard.appendChild(stepper);
    } else {
      modeCard.appendChild(el("p","rules-text",t("freeInfo")));
    }
    root.appendChild(modeCard);

    var rulesCard = el("div","card");
    var det = document.createElement("details");
    det.appendChild(el("summary",null,t("rulesSummary")));
    det.appendChild(el("div","rules-body",t("rules")));
    rulesCard.appendChild(det);
    root.appendChild(rulesCard);

    var startBtn = el("button","btn btn-gold btn-block", t("start"));
    startBtn.disabled = state.players.length < 2;
    startBtn.addEventListener("click", startGame);
    root.appendChild(startBtn);

    root.appendChild(el("div","footer-note",t("footer")));
  }

  function addPlayer(){
    var name = state.newPlayerName.trim();
    if(!name) return;
    state.players.push({name:name, lives:state.startingLives, losses:0, active:true});
    state.newPlayerName = "";
    render();
  }

  function startGame(){
    state.players.forEach(function(p){ p.lives = state.startingLives; p.losses=0; p.active=true; });
    state.currentIndex = 0;
    state.previousActual = null;
    state.round = 1;
    state.phase = "rolling";
    render();
  }

  // ---------- GAME ----------
  function renderGame(){
    root.innerHTML = "";

    var top = el("div","topbar");
    top.appendChild(el("span",null,t("round",{n:state.round})));
    top.appendChild(langSwitch());
    var right = el("div","topbar-right");
    var rb = el("button",null,t("rulesBtn"));
    rb.addEventListener("click", function(){ state.showRules = true; render(); });
    var endBtn = el("button",null,t("newGame"));
    endBtn.addEventListener("click", function(){
      if(state.spinTimer){ clearInterval(state.spinTimer); state.spinTimer=null; }
      state.phase="setup"; render();
    });
    right.appendChild(rb); right.appendChild(endBtn);
    top.appendChild(right);
    root.appendChild(top);

    var scoreboard = el("div","scoreboard");
    state.players.forEach(function(p, idx){
      var cls = "chip" + (idx===state.currentIndex && p.active ? " current":"") + (!p.active?" out":"");
      var chip = el("div", cls);
      if(state.mode==="lives"){
        chip.innerHTML = "<span>"+esc(p.name)+"</span>";
        var dots = el("span","lives-dots");
        for(var i=0;i<p.lives;i++){ dots.appendChild(el("span","dot")); }
        chip.appendChild(dots);
      } else {
        chip.innerHTML = "<span>"+t("chipLosses",{name:p.name,n:p.losses})+"</span>";
      }
      scoreboard.appendChild(chip);
    });
    root.appendChild(scoreboard);

    if(state.phase==="rolling") return renderRolling();
    if(state.phase==="spinning" || state.phase==="revealed") return renderDiceStage();
    if(state.phase==="pass") return renderPass();
    if(state.phase==="doubt") return renderDoubt();
    if(state.phase==="resolved") return renderResolved();
  }

  function renderRolling(){
    var current = state.players[state.currentIndex];
    var card = el("div","card turn-card");
    card.appendChild(el("div","who", t("turnOf",{name:current.name})));
    if(state.previousActual){
      card.appendChild(el("div","hint", t("handPhone",{name:current.name})));
      card.appendChild(el("div","prev-declared", t("remember")));
    } else {
      card.appendChild(el("div","hint", t("handPhoneNew",{name:current.name})));
    }
    var btn = el("button","btn btn-gold btn-block", t("roll"));
    btn.addEventListener("click", startRollAnimation);
    card.appendChild(btn);
    root.appendChild(card);
  }

  function startRollAnimation(){
    var d1 = rollDie(), d2 = rollDie();
    state.phase = "spinning";
    state.liveDice = [rollDie(), rollDie()];
    render();

    var ticks = 0;
    var maxTicks = 10;
    state.spinTimer = setInterval(function(){
      ticks++;
      state.liveDice = [rollDie(), rollDie()];
      if(ticks >= maxTicks){
        clearInterval(state.spinTimer);
        state.spinTimer = null;
        state.liveDice = [d1, d2];
        state.phase = "revealed";
        render();
      } else {
        updateDiceFaces();
      }
    }, 80);
  }

  function updateDiceFaces(){
    var dEls = root.querySelectorAll(".die");
    if(dEls.length===2){
      dEls[0].textContent = DICE_FACE[String(state.liveDice[0])];
      dEls[1].textContent = DICE_FACE[String(state.liveDice[1])];
    }
  }

  function renderDiceStage(){
    var current = state.players[state.currentIndex];
    var spinning = state.phase === "spinning";
    var card = el("div","card turn-card");
    card.appendChild(el("div","who", spinning ? t("rollingName",{name:current.name}) : t("yourRoll",{name:current.name})));
    card.appendChild(el("div","hint", spinning ? "" : t("onlyYou")));

    var stage = el("div","dice-stage");
    stage.appendChild(el("div","die " + (spinning ? "spinning":"settled"), DICE_FACE[String(state.liveDice[0])]));
    stage.appendChild(el("div","die " + (spinning ? "spinning":"settled"), DICE_FACE[String(state.liveDice[1])]));
    card.appendChild(stage);

    if(!spinning){
      card.appendChild(el("div","dice-sub", t("rolled",{a:state.liveDice[0], b:state.liveDice[1]})));
      var btn = el("button","btn btn-gold btn-block", t("saidIt"));
      btn.addEventListener("click", function(){
        state.previousActual = { playerIndex: state.currentIndex, dice: state.liveDice.slice() };
        state.currentIndex = nextActiveIndex(state.currentIndex);
        state.phase = "pass";
        render();
      });
      card.appendChild(btn);
    }
    root.appendChild(card);
  }

  function renderPass(){
    var next = state.players[state.currentIndex];
    var prevPlayer = state.players[state.previousActual.playerIndex];
    var card = el("div","card turn-card");
    card.appendChild(el("div","who", t("passTo",{name:next.name})));
    card.appendChild(el("div","hint", t("whatSaid",{name:prevPlayer.name})));

    var believeBtn = el("button","btn btn-truth btn-block", t("believe"));
    believeBtn.style.marginBottom = "10px";
    believeBtn.addEventListener("click", function(){ state.phase="rolling"; render(); });
    card.appendChild(believeBtn);

    var doubtBtn = el("button","btn btn-danger btn-block", t("doubt"));
    doubtBtn.addEventListener("click", function(){ state.phase="doubt"; render(); });
    card.appendChild(doubtBtn);

    root.appendChild(card);
  }

  function renderDoubt(){
    var pa = state.previousActual;
    var declarer = state.players[pa.playerIndex];
    var challenger = state.players[state.currentIndex];

    var card = el("div","card turn-card");
    card.appendChild(el("div","who", t("revealed")));

    var box = el("div","reveal-box");
    box.innerHTML = "<div class='lbl'>" + t("reallyHad",{name:declarer.name}) + "</div>" +
      "<div class='dice-stage' style='margin:8px 0 0;'>" +
        "<div class='die settled'>" + DICE_FACE[String(pa.dice[0])] + "</div>" +
        "<div class='die settled'>" + DICE_FACE[String(pa.dice[1])] + "</div>" +
      "</div>" +
      "<div class='dice-sub' style='margin-top:8px;'>(" + pa.dice[0] + " &middot; " + pa.dice[1] + ")</div>";
    card.appendChild(box);

    card.appendChild(el("div","hint", t("whoLost",{name:declarer.name})));

    var lieBtn = el("button","btn btn-danger btn-block", t("liedLoses",{name:declarer.name}));
    lieBtn.style.marginBottom="10px";
    lieBtn.addEventListener("click", function(){ applyVerdict(true); });
    card.appendChild(lieBtn);

    var truthBtn = el("button","btn btn-truth btn-block", t("mistakenLoses",{name:challenger.name}));
    truthBtn.addEventListener("click", function(){ applyVerdict(false); });
    card.appendChild(truthBtn);

    root.appendChild(card);
  }

  function applyVerdict(liar){
    var pa = state.previousActual;
    var declarerIdx = pa.playerIndex;
    var challengerIdx = state.currentIndex;
    var loserIdx = liar ? declarerIdx : challengerIdx;

    var loser = state.players[loserIdx];
    if(state.mode==="lives"){
      loser.lives -= 1;
      if(loser.lives <= 0){ loser.active = false; }
    } else {
      loser.losses += 1;
    }

    state.outcome = { liar: liar, declarerIdx: declarerIdx, challengerIdx: challengerIdx, loserIdx: loserIdx };
    state.phase = "resolved";
    render();
  }

  function renderResolved(){
    var oc = state.outcome;
    var declarer = state.players[oc.declarerIdx];
    var loser = state.players[oc.loserIdx];

    var card = el("div","card");
    card.appendChild(el("div","outcome-banner " + (oc.liar ? "lie":"truth"),
      oc.liar ? t("bannerLie",{name:declarer.name}) : t("bannerTruth",{name:declarer.name})));

    var resultText = t("lostRound",{name:loser.name});
    if(state.mode==="lives"){
      resultText += loser.active ? t("lostLife",{n:loser.lives}) : t("eliminated");
    } else {
      resultText += t("lossesTotal",{n:loser.losses});
    }
    card.appendChild(el("p","rules-text", resultText));
    root.appendChild(card);

    if(state.mode==="lives" && activePlayers().length<=1){
      var cont = el("button","btn btn-gold btn-block", t("showResult"));
      cont.addEventListener("click", function(){ state.phase="gameover"; render(); });
      root.appendChild(cont);
      return;
    }

    var cont2 = el("button","btn btn-gold btn-block", t("nextRound"));
    cont2.addEventListener("click", function(){
      state.round += 1;
      state.previousActual = null;
      state.currentIndex = loser.active ? oc.loserIdx : nextActiveIndex(oc.loserIdx);
      state.phase = "rolling";
      render();
    });
    root.appendChild(cont2);
  }

  // ---------- GAME OVER ----------
  function renderGameOver(){
    root.innerHTML = "";
    var top = el("div","setup-top");
    top.appendChild(langSwitch());
    root.appendChild(top);
    root.appendChild(el("div","brand","<h1>Macháček</h1>"));

    var card = el("div","card winner-card");
    if(state.mode==="lives"){
      var winner = activePlayers()[0];
      card.appendChild(el("div","trophy","🏆"));
      card.appendChild(el("h2",null, winner ? t("wins",{name:winner.name}) : t("gameOver")));
    } else {
      card.appendChild(el("h2",null,t("standings")));
    }

    var sorted = state.players.slice().sort(function(a,b){
      if(state.mode==="lives"){
        if(a.active!==b.active) return a.active? -1:1;
        return b.lives - a.lives;
      }
      return a.losses - b.losses;
    });
    var ul = el("ul","standings");
    sorted.forEach(function(p){
      var li = document.createElement("li");
      var right = state.mode==="lives" ? (p.active ? (p.lives + " ♥") : t("outTxt")) : t("lossesLbl",{n:p.losses});
      li.innerHTML = "<span>"+esc(p.name)+"</span><span>"+right+"</span>";
      ul.appendChild(li);
    });
    card.appendChild(ul);
    root.appendChild(card);

    var again = el("button","btn btn-gold btn-block", t("playAgain"));
    again.style.marginTop="14px";
    again.addEventListener("click", startGame);
    root.appendChild(again);

    var newSetup = el("button","btn btn-outline btn-block", t("newSetup"));
    newSetup.style.marginTop="10px";
    newSetup.addEventListener("click", function(){ state.phase="setup"; render(); });
    root.appendChild(newSetup);
  }

  render();
})();

</script>
</body>
</html>
