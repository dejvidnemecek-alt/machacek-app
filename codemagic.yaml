workflows:
  android-release:
    name: Android release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      android_signing:
        - machacek_keystore
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
